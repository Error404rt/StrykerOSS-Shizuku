name: Build StrykerOSS Shizuku
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream StrykerOSS 6.5
        uses: actions/checkout@v4
        with:
          repository: zalexdev/strykerapp
          ref: 6.5
          path: upstream
      - name: Apply Shizuku integration
        run: |
          bash tools/apply-shizuku.sh
          bash tools/apply-terminal-shizuku.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=1 "platforms;android-37" "build-tools;37.0.0" "ndk;25.1.8937393"
      - name: Build release
        working-directory: upstream
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Build debug
        working-directory: upstream
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StrykerOSS-Shizuku-6.5
          path: |
            upstream/app/build/outputs/apk/release/*.apk
            upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
